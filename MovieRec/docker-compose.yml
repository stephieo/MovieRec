services:
  web:
    image: movierec
    build: .
    ports:
      - "8000:8000"
    env_file: .env.dev  # Use development environment file
    depends_on: # will only start after db and redis are ready
      - db
      - redis
    volumes:
      - .:/MovieRec # sync changes in the local directory to the container

  db:
    image: postgres:17
    ports:
      - "5432:5432" # port in container: port in host/local
    env_file: .env.dev  # Use development environment file
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:8.0
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
